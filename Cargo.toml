[workspace]
members = [".", "tools/volkrix-nnue"]

[package]
name = "volkrix"
version = "0.2.3"
edition = "2024"
authors = ["Monty Bognar"]
license = "MIT OR Apache-2.0"
description = "Volkrix, a clean-room Rust UCI chess engine."
repository = "https://github.com/mlb07/volkrix"
homepage = "https://github.com/mlb07/volkrix"
readme = "README.md"
keywords = ["chess", "engine", "uci", "nnue"]
categories = ["games", "command-line-utilities"]

[features]
internal-testing = []
offline-tools = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
cc = "1.1"

[[bin]]
name = "volkrix-stress"
path = "src/bin/volkrix-stress.rs"
required-features = ["internal-testing"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
