name: Release Build

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: volkrix-x86_64-unknown-linux-gnu.tar.gz
            binary: volkrix
            rustflags: ""
          - os: macos-15
            target: aarch64-apple-darwin
            archive: volkrix-aarch64-apple-darwin.tar.gz
            binary: volkrix
            rustflags: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: volkrix-x86_64-pc-windows-msvc.zip
            binary: volkrix.exe
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Third-party license and provenance audit
        run: python scripts/audit_third_party.py

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --release --package volkrix --bin volkrix --target ${{ matrix.target }}

      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="volkrix-${{ matrix.target }}"
          mkdir -p "$bundle_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$bundle_dir/${{ matrix.binary }}"
          cp README.md THIRD_PARTY_NOTICES.md LICENSE-MIT LICENSE-APACHE "$bundle_dir/"
          mkdir -p "$bundle_dir/scripts"
          cp scripts/fetch-stockfish18-net.sh "$bundle_dir/scripts/"
          chmod +x "$bundle_dir/scripts/fetch-stockfish18-net.sh"

          # Official bundles are strength-ready: the verified large SF18 network
          # sits beside the executable for Volkrix's runtime sibling discovery.
          scripts/fetch-stockfish18-net.sh \
            "$bundle_dir/nn-c288c895ea92.nnue"
          test -s "$bundle_dir/nn-c288c895ea92.nnue"

      - name: Smoke-test packaged binary and network
        run: >-
          python scripts/uci_smoke.py
          --engine "volkrix-${{ matrix.target }}/${{ matrix.binary }}"
          --evalfile "volkrix-${{ matrix.target }}/nn-c288c895ea92.nnue"
          --transcript "volkrix-${{ matrix.target }}/uci-smoke.log"

      - name: Create tarball
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" "volkrix-${{ matrix.target }}"

      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "volkrix-${{ matrix.target }}" -DestinationPath "${{ matrix.archive }}"

      - name: Create archive checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "${{ matrix.archive }}" "${{ matrix.archive }}.sha256" --clobber
